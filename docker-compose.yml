# Ferretería Cafetera: cada microservicio y cada base de datos en su propio contenedor.
services:

  # Base de datos del API Gateway
  mysql-gateway:
    image: mysql:8.4                              # Imagen oficial de MySQL
    container_name: mysql-gateway                 # Nombre del contenedor
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # Contraseña de root, viene del .env de la raíz
      MYSQL_DATABASE: gateway_db                  # Crea la base de datos la primera vez que arranca
      MYSQL_USER: gateway_user                    # Crea el usuario que usa el Gateway
      MYSQL_PASSWORD: ${GATEWAY_DB_PASSWORD}      # Contraseña de ese usuario, viene del .env de la raíz
    ports:
      - "3307:3306"                               # 3307 en el computador, 3306 dentro del contenedor
    volumes:
      - mysql-gateway-data:/var/lib/mysql         # Guarda los datos aunque el contenedor se borre
    healthcheck:                                  # Revisa cada 5 s si MySQL ya acepta conexiones
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # API Gateway (Laravel)
  gateway:
    build: ./gateway                              # Se construye desde gateway/Dockerfile
    container_name: gateway                       # Nombre del contenedor
    ports:
      - "8000:8000"                               # 8000 en el computador y en el contenedor
    volumes:
      - ./gateway:/var/www/html                   # En desarrollo, los cambios se ven sin reconstruir la imagen
    depends_on:
      mysql-gateway:
        condition: service_healthy                # Espera a que MySQL esté listo antes de arrancar
  
  # Base de datos proveedores
  mysql-proveedores:
    image: mysql:8.4
    container_name: mysql-proveedores
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: proveedores_db
      MYSQL_USER: proveedores_user
      MYSQL_PASSWORD: ${PROVEEDORES_DB_PASSWORD}
    ports:
      - "3309:3306"
    volumes:
      - mysql-proveedores-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20 

  # Microservicio de Proveedores (Django)
  proveedores:
    build: ./proveedores
    container_name: proveedores
    ports:
      - "8002:8000"
    environment:
      DB_HOST: mysql-proveedores
      DB_PORT: 3306
      DB_DATABASE: proveedores_db
      DB_USERNAME: proveedores_user
      DB_PASSWORD: ${PROVEEDORES_DB_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    volumes:
      - ./proveedores:/app
    depends_on:
      mysql-proveedores:
        condition: service_healthy

  # Base de datos de Inventario
  mysql-inventario:
    image: mysql:8.4
    container_name: mysql-inventario
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: inventario_db
      MYSQL_USER: inventario_user
      MYSQL_PASSWORD: ${INVENTARIO_DB_PASSWORD}
    ports:
      - "3308:3306"                               # 3308 en el computador
    volumes:
      - mysql-inventario-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Microservicio de Inventario (Django)
  inventario:
    build: ./inventario                           # Se construye desde inventario/Dockerfile
    container_name: inventario
    ports:
      - "8001:8000"                               # 8001 en el computador, 8000 dentro del contenedor
    environment:
      DB_HOST: mysql-inventario                   # Nombre del contenedor de su base de datos
      DB_PORT: 3306
      DB_DATABASE: inventario_db
      DB_USERNAME: inventario_user
      DB_PASSWORD: ${INVENTARIO_DB_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}           # Token interno
      CATALOGO_URL: http://catalogo:3000          # Para validar que el producto exista
      NOTIFICACIONES_URL: http://notificaciones:3000  # Para las alertas de stock bajo
    volumes:
      - ./inventario:/app                         # En desarrollo, el código de tu carpeta
    depends_on:
      mysql-inventario:
        condition: service_healthy

  # Base de datos de Compras
  mysql-compras:
    image: mysql:8.4
    container_name: mysql-compras
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: compras_db
      MYSQL_USER: compras_user
      MYSQL_PASSWORD: ${COMPRAS_DB_PASSWORD}
    ports:
      - "3311:3306"                               # 3311 en el computador
    volumes:
      - mysql-compras-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Microservicio de Compras y devoluciones (Flask)
  compras:
    build: ./compras                              # Se construye desde compras/Dockerfile
    container_name: compras
    ports:
      - "5001:5000"                               # 5001 en el computador, 5000 dentro del contenedor
    environment:
      DB_HOST: mysql-compras
      DB_PORT: 3306
      DB_DATABASE: compras_db
      DB_USERNAME: compras_user
      DB_PASSWORD: ${COMPRAS_DB_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      INVENTARIO_URL: http://inventario:8000      # Registra las entradas y salidas de stock
      PROVEEDORES_URL: http://proveedores:8000    # Valida el proveedor de la orden
    volumes:
      - ./compras:/app
    depends_on:
      mysql-compras:
        condition: service_healthy
      inventario:
        condition: service_started


# Volúmenes donde Docker guarda los datos de las bases de datos
volumes:
  mysql-gateway-data:
  mysql-proveedores-data:
  mysql-inventario-data:
  mysql-compras-data: