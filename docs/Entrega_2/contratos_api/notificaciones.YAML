# Contrato de API · Microservicio de Notificaciones (Express)
openapi: 3.0.3
info:
  title: API de Notificaciones · Ferretería Cafetera
  version: 1.0.0
  description: |
    Microservicio de Notificaciones, construido en Express. Es un servicio sin estado y no tiene base de datos.
    No se expone a través del Gateway: solo recibe llamadas internas dentro del clúster, con el token interno.
servers:
  - url: http://notificaciones:3000
    description: Red interna del clúster de Kubernetes
tags:
  - name: Alertas
    description: Envío de alertas de stock bajo por correo (REQ-F-015)
security:
  - tokenInterno: []
paths:
  /alertas:
    post:
      tags:
        - Alertas
      summary: Recibe una alerta de stock bajo
      description: |
        Solo lo llama Inventario cuando un producto queda por debajo del mínimo.
        Responde de inmediato y en segundo plano pide al Gateway los destinatarios de la bodega y envía el correo por SMTP.
        No guarda nada: si el envío falla, reintenta y deja el error en el log con el Correlation ID.
      parameters:
        - name: X-Correlation-Id
          in: header
          required: true
          schema:
            type: string
            example: 3f2a9c1e-7b4d-4e8a-9f61-2c5d8e0a1b47
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - producto_id
                - bodega_id
                - cantidad_actual
                - stock_minimo
              properties:
                producto_id:
                  type: integer
                  example: 1024
                producto_codigo:
                  type: string
                  example: ELE-CAB-12
                producto_nombre:
                  type: string
                  example: Cable eléctrico calibre 12 AWG
                bodega_id:
                  type: integer
                  example: 3
                cantidad_actual:
                  type: number
                  example: 8
                stock_minimo:
                  type: number
                  example: 20
      responses:
        "202":
          description: Alerta recibida, el correo se envía en segundo plano
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Alerta recibida
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          description: Falta el token interno o no es válido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    tokenInterno:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Token compartido entre los servicios, guardado en un Secret de Kubernetes
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: DATOS_INVALIDOS
        mensaje:
          type: string
          example: La cantidad debe ser mayor que cero
        correlation_id:
          type: string
          example: 3f2a9c1e-7b4d-4e8a-9f61-2c5d8e0a1b47
  responses:
    DatosInvalidos:
      description: Los datos enviados no son válidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
